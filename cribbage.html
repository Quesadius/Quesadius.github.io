function newGameState(creatorUid, creatorName){
  return {
    _kind: KIND_GAME,
    createdAt: Date.now(),
    lastUpdated: Date.now(),
    player1: { uid: creatorUid, name: creatorName },
    player2: null,
    playerIds: [creatorUid],
    phase: 'waiting',            // 'waiting'|'cut_for_deal'|'cut_for_deal_done'|'discard'|'cut'|'pegging'|'count'|'game_done'
    scores: { [creatorUid]: 0 },
    prevScores: { [creatorUid]: 0 },   // for back-peg display (last position)
    dealer: null,                      // set by the cut-for-deal
    firstDealerUid: null,
    pone: null,
    handNumber: 0,
    hands: {},                         // [uid]: cards array (private — opponent sees backs)
    crib: [],
    starter: null,
    // pegging:
    peggingRound: [],     // {uid, card} since last reset
    peggingHistory: [],   // all plays this hand
    peggingTotal: 0,
    peggingTurn: null,
    peggingGoes: [],      // uids who said go this round
    peggingDone: false,
    // counting:
    countBreakdown: null, // { uid, source: 'hand'|'crib', total, items, cards }
    countAcks: [],        // uids who clicked Continue
    // per-game stats accrual:
    bests: {},            // [uid]: { hand, crib, pegRun }
    rematchVotes: []
  };
}

function opponentOf(uid){
  if (!G) return null;
  return G.playerIds.find(p => p !== uid) || null;
}
function nameOf(uid){
  if (!G) return '?';
  if (G.player1 && G.player1.uid === uid) return G.player1.name;
  if (G.player2 && G.player2.uid === uid) return G.player2.name;
  return '?';
}

/* ========================================================================
   6. Firestore actions
   ======================================================================== */
function gameRef(uuid){ return doc(db, `${GAMES_PATH}/${gameDocId(uuid)}`); }
function historyRef(uuid){ return doc(db, `${GAMES_PATH}/${historyDocId(uuid)}`); }
function playerRef(uid){ return doc(db, `${GAMES_PATH}/${playerDocId(uid)}`); }

// Atomic read-modify-write helper for any action where both players can act concurrently.
// modifyFn(fresh) may mutate `fresh` and return it, or return false to abort.
async function txUpdate(modifyFn, label){
  const tag = label || 'tx';
  if (!gameId){
    console.error(`[cribbage] ${tag} with null gameId`);
    alert('Internal error: gameId not set. Reload the page.');
    throw new Error('gameId null');
  }
  console.log(`[cribbage] ${tag} starting`);
  let attempts = 0;
  try {
    const txPromise = runTransaction(db, async (tx) => {
      attempts++;
      console.log(`[cribbage] ${tag} attempt #${attempts}`);
      const snap = await tx.get(gameRef(gameId));
      if (!snap.exists()){ console.log(`[cribbage] ${tag} doc missing`); return; }
      const fresh = snap.data();
      const result = modifyFn(fresh);
      if (result === false){ console.log(`[cribbage] ${tag} modifyFn aborted`); return; }
      const out = result || fresh;
      out.lastUpdated = Date.now();
      tx.set(gameRef(gameId), out);
      console.log(`[cribbage] ${tag} attempt #${attempts} writing`);
    });
    // 15s timeout so a hung transaction surfaces an error rather than spinning forever.
    const timeoutPromise = new Promise((_, rej) =>
      setTimeout(() => rej(new Error(`${tag} timed out after 15s`)), 15000));
    await Promise.race([txPromise, timeoutPromise]);
    console.log(`[cribbage] ${tag} done after ${attempts} attempt(s)`);
  } catch(e){
    console.error(`[cribbage] ${tag} failed:`, e);
    alert(`Sync failed: ${e.code || e.message}. Check your network and reload.`);
    throw e;
  }
}

async function pushState(gs){
  if (!gameId){
    console.error('[cribbage] pushState with null gameId; aborting');
    alert('Internal error: gameId not set. Reload the page.');
    throw new Error('gameId null');
  }
  gs.lastUpdated = Date.now();
  console.log('[cribbage] pushState writing to', gameDocId(gameId), 'phase=', gs.phase);
  try {
    await setDoc(gameRef(gameId), gs);
  } catch(e){
    console.error('Firestore write failed:', e);
    alert(`Sync failed: ${e.code || e.message}. Check your network and reload.`);
    throw e;
  }
}

async function setupNewGame(){
  const name = getPlayerName();
  if (!name){ alert('Please enter your name first.'); return; }
  if (!isAuthReady || !userId){ alert('Still connecting — please wait a moment and try again.'); return; }
  const newId = crypto.randomUUID();
  const gs = newGameState(userId, name);
  try {
    await setDoc(gameRef(newId), gs);
  } catch(e){
    console.error('Failed to create game', e);
    alert(`Could not create game: ${e.message || e.code || e}`);
    return;
  }
  gameId = newId;
  attachListener(newId);
  updateURL();
}

async function joinExistingGame(id){
  gameId = id;
  const ref = gameRef(id);
  const snap = await getDoc(ref);
  if (!snap.exists()){
    alert('Game not found. Returning to menu.');
    gameId = null;
    history.replaceState(null,'',location.pathname);
    showMenu();
    return;
  }
  const data = snap.data();
  // If we're not already in the game, claim slot 2 (or rejoin slot 1)
  if (!data.playerIds.includes(userId)){
    if (data.player2){
      alert('This game already has two players.');
      gameId = null;
      history.replaceState(null,'',location.pathname);
      showMenu();
      return;
    }
    const name = getPlayerName();
    if (!name){ alert('Please enter your name first.'); return; }
    data.player2 = { uid: userId, name };
    data.playerIds = [...data.playerIds, userId];
    data.scores[userId] = 0;
    data.prevScores[userId] = 0;
    // First dealer decided by cut: each player picks a card from the spread deck.
    // The deck order is fixed here so both clients see the same fan; picks are
    // per-player fields so concurrent picks can't clobber each other.
    data.phase = 'cut_for_deal';
    data.cutDeck = shuffleInPlace(makeDeck());
    data.cutForDeal = {};
    data.cutForDealPicks = {};
    data.cutForDealTies = 0;
    await setDoc(ref, data);
  }
  attachListener(id);
}

function attachListener(id){
  if (unsub) unsub();
  unsub = onSnapshot(gameRef(id), (snap)=>{
    if (!snap.exists()){
      // Game deleted
      G = null;
      gameId = null;
      history.replaceState(null,'',location.pathname);
      showMenu();
      return;
    }
    G = snap.data();
    // Rematch hop: a finished game pointing at its successor moves both players over.
    if (G.nextGameId && G.phase === 'game_done'){
      gameId = G.nextGameId;
      attachListener(gameId);
      updateURL();
      return;
    }
    showGame();
    render();
  });
  startPresence();
}

async function leaveGame(){
  stopPresence();
  if (unsub){ unsub(); unsub = null; }
  gameId = null;
  G = null;
  history.replaceState(null,'',location.pathname);
  showMenu();
}

/* ---- Presence: a light heartbeat so each player can see the other is around ---- */
let presenceTimer = null;
function presenceBeat(){
  if (!gameId || !userId) return;
  updateDoc(gameRef(gameId), { [`presence.${userId}`]: Date.now() }).catch(()=>{});
}
function startPresence(){
  stopPresence();
  presenceBeat();
  presenceTimer = setInterval(presenceBeat, 25000);
  document.addEventListener('visibilitychange', presenceBeat);
}
function stopPresence(){
  if (presenceTimer){ clearInterval(presenceTimer); presenceTimer = null; }
  document.removeEventListener('visibilitychange', presenceBeat);
}
function isOnline(uid){
  const last = (G && G.presence && G.presence[uid]) || 0;
  return (Date.now() - last) < 70000;
}

/* ========================================================================
   7. Hand lifecycle
   ======================================================================== */
function startNewHand(gs){
  gs.handNumber = (gs.handNumber || 0) + 1;
  // Alternate dealer except for first hand (where it's already set)
  if (gs.handNumber > 1){
    const cur = gs.dealer;
    gs.dealer = gs.playerIds.find(p => p !== cur);
  }
  gs.pone = gs.playerIds.find(p => p !== gs.dealer);
  const deck = shuffleInPlace(makeDeck());
  // 6 cards each
  gs.hands = {};
  gs.hands[gs.dealer] = deck.slice(0,6).sort(sortCardsByOrder);
  gs.hands[gs.pone] = deck.slice(6,12).sort(sortCardsByOrder);
  gs.crib = [];
  gs.starter = null;
  gs.peggingRound = [];
  gs.peggingHistory = [];
  gs.peggingTotal = 0;
  gs.peggingTurn = null;
  gs.peggingGoes = [];
  gs.peggingDone = false;
  gs.peggingRoundCompleted = false;
  gs.lastPegEvent = null;
  gs.countBreakdown = null;
  gs.countAcks = [];
  gs.phase = 'discard';
  // Save the rest of the deck on the doc temporarily for the cut (so cut is deterministic
  // and seen by both players). We strip dealt cards from the deck for the cut.
  gs._cutDeck = deck.slice(12);
  appendLog(gs, null, `— Hand ${gs.handNumber}: ${nameOf(gs.dealer)} deals —`);
}

function sortCardsByOrder(a,b){ return orderOf(a) - orderOf(b); }

function cardText(c){ return `${labelOf(c)}${SUIT_GLYPH[suitOf(c)]}`; }

// Append a line to the shared game log (capped). uid null = neutral event.
function appendLog(gs, uid, text, pts){
  gs.log = gs.log || [];
  gs.log.push({ t: Date.now(), uid: uid || null, text, pts: pts || 0 });
  if (gs.log.length > 40) gs.log = gs.log.slice(-40);
}

/* Actions during play */

async function actPickCutForDeal(index){
  if (!G || G.phase !== 'cut_for_deal') return;
  if (G.cutForDeal && G.cutForDeal[userId]) return;
  await txUpdate((fresh) => {
    if (fresh.phase !== 'cut_for_deal') return false;
    fresh.cutForDeal = fresh.cutForDeal || {};
    fresh.cutForDealPicks = fresh.cutForDealPicks || {};
    if (fresh.cutForDeal[userId]) return false;
    const deck = fresh.cutDeck || shuffleInPlace(makeDeck());
    const takenIdx = new Set(Object.values(fresh.cutForDealPicks));
    let ix = Math.max(0, Math.min(deck.length - 1, index|0));
    while (takenIdx.has(ix)) ix = (ix + 1) % deck.length;  // concurrent same-card pick → next card
    fresh.cutForDeal[userId] = deck[ix];
    fresh.cutForDealPicks[userId] = ix;
    const allCut = fresh.playerIds.every(uid => fresh.cutForDeal[uid]);
    if (allCut){
      const [u1, u2] = fresh.playerIds;
      const c1 = fresh.cutForDeal[u1], c2 = fresh.cutForDeal[u2];
      if (orderOf(c1) === orderOf(c2)){
        // Tie — both pick again from a fresh shuffle.
        fresh.cutForDeal = {};
        fresh.cutForDealPicks = {};
        fresh.cutDeck = shuffleInPlace(makeDeck());
        fresh.cutForDealTies = (fresh.cutForDealTies || 0) + 1;
      } else {
        fresh.dealer = orderOf(c1) < orderOf(c2) ? u1 : u2;
        fresh.firstDealerUid = fresh.dealer;
        fresh.phase = 'cut_for_deal_done';
        appendLog(fresh, null, `${nameOf(u1)} cut ${cardText(c1)}, ${nameOf(u2)} cut ${cardText(c2)} — ${nameOf(fresh.dealer)} deals first`);
      }
    }
    return fresh;
  }, 'pickCutForDeal');
}

async function actStartFirstHand(){
  if (!G || G.phase !== 'cut_for_deal_done') return;
  await txUpdate((fresh) => {
    if (fresh.phase !== 'cut_for_deal_done') return false;
    delete fresh.cutForDeal;
    delete fresh.cutForDealPicks;
    delete fresh.cutDeck;
    delete fresh.cutForDealTies;
    startNewHand(fresh);
    return fresh;
  }, 'startFirstHand');
}

async function actDiscardToCrib(cards){
  console.log('[cribbage] actDiscardToCrib called with', cards, 'userId=', userId);
  if (!G){ alert('Game state not loaded.'); return; }
  if (G.phase !== 'discard'){ alert(`Cannot discard in phase: ${G.phase}`); return; }
  await txUpdate((fresh) => {
    if (fresh.phase !== 'discard') return false;
    const myHand = fresh.hands && fresh.hands[userId];
    if (!myHand){ alert(`Your hand isn't dealt yet.`); return false; }
    if (myHand.length <= 4) return false;  // already discarded
    for (const c of cards){
      const ix = myHand.indexOf(c);
      if (ix < 0){
        alert(`Card ${c} not in your hand: [${myHand.join(', ')}]`);
        return false;
      }
      myHand.splice(ix,1);
    }
    fresh.crib.push(...cards);
    const allDone = fresh.playerIds.every(uid => fresh.hands[uid].length === 4);
    if (allDone) fresh.phase = 'cut';
    return fresh;
  }, 'discard');
}

async function actCutDeck(position){
  if (!G || G.phase !== 'cut') return;
  if (userId !== G.pone) return;  // only pone cuts
  const gs = clone(G);
  const deck = gs._cutDeck || [];
  const idx = Math.max(0, Math.min(deck.length-1, position|0));
  gs.starter = deck[idx];
  delete gs._cutDeck;
  appendLog(gs, gs.pone, `cut starter ${cardText(gs.starter)}`);
  // His heels: dealer scores 2 if starter is a Jack
  if (rankOf(gs.starter) === 'J'){
    addScore(gs, gs.dealer, 2);
    gs.lastPegEvent = { uid: gs.dealer, items: [{name:'His heels (Jack)', pts:2}], total:2, at: Date.now() };
    appendLog(gs, gs.dealer, 'his heels — Jack starter', 2);
  }
  if (checkGameOver(gs)) { await pushState(gs); return; }
  gs.phase = 'pegging';
  gs.peggingTurn = gs.pone;  // pone leads pegging
  gs.peggingRound = [];
  gs.peggingTotal = 0;
  gs.peggingGoes = [];
  await pushState(gs);
}

async function actPlayCard(card){
  if (!G || G.phase !== 'pegging') return;
  if (G.peggingTurn !== userId) return;
  const gs = clone(G);

  // If the previous round was just completed (after a 31 / go), defer the reset
  // until now so the cards stayed visible. Reset before we add this new play.
  if (gs.peggingRoundCompleted){
    gs.peggingRound = [];
    gs.peggingTotal = 0;
    gs.peggingGoes = [];
    gs.peggingRoundCompleted = false;
  }

  const myHand = gs.hands[userId];
  const ix = myHand.indexOf(card);
  if (ix < 0) return;
  if (gs.peggingTotal + valueOf(card) > 31) return;
  myHand.splice(ix,1);
  gs.peggingRound.push({ uid: userId, card });
  gs.peggingHistory.push({ uid: userId, card });
  gs.peggingTotal += valueOf(card);

  // Score the play
  const cards = gs.peggingRound.map(p => p.card);
  const { pts, items } = scorePeggingPlay(cards);
  const itemsTxt = pts > 0 ? ` — ${items.map(i => i.name).join(' + ')}` : '';
  appendLog(gs, userId, `played ${cardText(card)} (${gs.peggingTotal})${itemsTxt}`, pts);
  if (pts > 0){
    addScore(gs, userId, pts);
    gs.lastPegEvent = { uid: userId, items, total: pts, at: Date.now() };
    const runItem = items.find(i => i.name && i.name.startsWith('Run'));
    if (runItem){
      gs.bests[userId] = gs.bests[userId] || {};
      if ((gs.bests[userId].pegRun || 0) < runItem.pts) gs.bests[userId].pegRun = runItem.pts;
    }
  }
  if (checkGameOver(gs)){ await pushState(gs); return; }

  const allEmpty = gs.playerIds.every(uid => gs.hands[uid].length === 0);
  const hit31 = gs.peggingTotal === 31;

  if (allEmpty){
    if (!hit31){
      addScore(gs, userId, 1);
      appendLog(gs, userId, 'last card', 1);
      // Combine the play's items (if any) with the +1 last-card so the popup shows both.
      const lastItems = [...(pts>0?items:[]), {name:'Last card', pts:1}];
      const lastTotal = (pts>0?pts:0) + 1;
      gs.lastPegEvent = { uid: userId, items: lastItems, total: lastTotal, at: Date.now() };
      if (checkGameOver(gs)){ await pushState(gs); return; }
    }
    gs.peggingRoundCompleted = true;   // keep cards on screen during count
    enterCounting(gs);
  } else if (hit31){
    // Mark the round as completed — KEEP cards visible. They'll be cleared on the next play.
    gs.peggingRoundCompleted = true;
    gs.peggingTurn = opponentInGame(gs, userId);
  } else {
    const opp = opponentInGame(gs, userId);
    const oppHandEmpty = gs.hands[opp].length === 0;
    const oppCanPlay = !oppHandEmpty && gs.hands[opp].some(c => valueOf(c) + gs.peggingTotal <= 31);
    if (oppCanPlay){
      gs.peggingTurn = opp;
    } else if (oppHandEmpty || gs.peggingGoes.includes(opp)){
      const meCanPlayMore = gs.hands[userId].some(c => valueOf(c) + gs.peggingTotal <= 31);
      if (meCanPlayMore){
        gs.peggingTurn = userId;
      } else {
        // Both stuck → end round; +1 last card to me. Keep cards visible.
        addScore(gs, userId, 1);
        appendLog(gs, userId, 'last card', 1);
        const lastItems = [...(pts>0?items:[]), {name:'Last card', pts:1}];
        const lastTotal = (pts>0?pts:0) + 1;
        gs.lastPegEvent = { uid: userId, items: lastItems, total: lastTotal, at: Date.now() };
        if (checkGameOver(gs)){ await pushState(gs); return; }
        gs.peggingRoundCompleted = true;
        gs.peggingTurn = opp;
      }
    } else {
      gs.peggingTurn = opp;
    }
  }
  await pushState(gs);
}

async function actSayGo(){
  if (!G || G.phase !== 'pegging') return;
  if (G.peggingTurn !== userId) return;
  const myHand = G.hands[userId];
  const canPlay = myHand.some(c => valueOf(c) + effectivePegTotal(G) <= 31);
  if (canPlay) return;
  const gs = clone(G);
  if (!gs.peggingGoes.includes(userId)) gs.peggingGoes.push(userId);
  appendLog(gs, userId, 'says "go"');
  const oppId = opponentInGame(gs, userId);
  const oppHandEmpty = gs.hands[oppId].length === 0;
  const oppCanPlay = !oppHandEmpty && gs.hands[oppId].some(c => valueOf(c) + effectivePegTotal(gs) <= 31);
  if (oppCanPlay){
    gs.peggingTurn = oppId;
  } else {
    // Neither can play. Award +1 to last player. Keep cards visible.
    const lastPlay = gs.peggingRound[gs.peggingRound.length-1];
    if (lastPlay){
      addScore(gs, lastPlay.uid, 1);
      appendLog(gs, lastPlay.uid, 'go point', 1);
      gs.lastPegEvent = { uid: lastPlay.uid, items: [{name:'Go', pts:1}], total:1, at: Date.now() };
      if (checkGameOver(gs)){ await pushState(gs); return; }
    }
    gs.peggingRoundCompleted = true;   // KEEP cards on screen until next play
    if (gs.playerIds.every(uid => gs.hands[uid].length === 0)){
      enterCounting(gs);
    } else if (lastPlay){
      gs.peggingTurn = opponentInGame(gs, lastPlay.uid);
    } else {
      gs.peggingTurn = gs.pone;
    }
  }
  await pushState(gs);
}

function opponentInGame(gs, uid){
  return gs.playerIds.find(p => p !== uid);
}

// Effective running total for "can this player act?" decisions. Once a round is
// completed (31 / go / both-stuck) the cards stay on screen until the next play,
// but the running total no longer constrains the next leader — they're starting a
// fresh round at 0. Using the raw peggingTotal here would trap the leader: every
// card looks too big, so the UI offers only "Say Go", and each press re-awards the
// go point to the last player. Display code still reads the raw peggingTotal.
function effectivePegTotal(gs){ return gs.peggingRoundCompleted ? 0 : gs.peggingTotal; }

function enterCounting(gs){
  // Reconstruct each player's 4-card hand from pegging history.
  gs.handsForCount = {};
  for (const uid of gs.playerIds){
    gs.handsForCount[uid] = gs.peggingHistory.filter(p => p.uid === uid).map(p => p.card).sort(sortCardsByOrder);
  }
  gs.phase = 'count';
  gs.countAcks = [];

  const pone = gs.pone, dealer = gs.dealer;
  const ponePts   = scoreHand(gs.handsForCount[pone], gs.starter, false);
  const dealerPts = scoreHand(gs.handsForCount[dealer], gs.starter, false);
  const cribPts   = scoreHand(gs.crib, gs.starter, true);

  // Pone counts first; if pone hits 121, game ends and dealer doesn't count.
  addScore(gs, pone, ponePts.total);
  updateBest(gs, pone, 'hand', ponePts.total);
  appendLog(gs, pone, `hand scores ${ponePts.total}`, ponePts.total);
  if (!checkGameOver(gs)){
    addScore(gs, dealer, dealerPts.total);
    updateBest(gs, dealer, 'hand', dealerPts.total);
    appendLog(gs, dealer, `hand scores ${dealerPts.total}`, dealerPts.total);
  }
  if (!checkGameOver(gs)){
    addScore(gs, dealer, cribPts.total);
    updateBest(gs, dealer, 'crib', cribPts.total);
    appendLog(gs, dealer, `crib scores ${cribPts.total}`, cribPts.total);
  }

  gs.countBreakdown = {
    starter: gs.starter,
    pone:   { uid: pone,   cards: gs.handsForCount[pone],   items: ponePts.items,   total: ponePts.total },
    dealer: { uid: dealer, cards: gs.handsForCount[dealer], items: dealerPts.items, total: dealerPts.total },
    crib:   { uid: dealer, cards: gs.crib,                  items: cribPts.items,   total: cribPts.total }
  };
}

async function actContinueCount(){
  if (!G || G.phase !== 'count') return;
  await txUpdate((fresh) => {
    if (fresh.phase !== 'count') return false;
    if (!fresh.countAcks) fresh.countAcks = [];
    if (!fresh.countAcks.includes(userId)) fresh.countAcks.push(userId);
    if (fresh.countAcks.length < fresh.playerIds.length) return fresh;
    fresh.countAcks = [];
    fresh.countBreakdown = null;
    if (checkGameOver(fresh)) return fresh;
    startNewHand(fresh);
    return fresh;
  }, 'continueCount');
}

/* ========================================================================
   8. Scoring helpers / game over
   ======================================================================== */
function addScore(gs, uid, pts){
  if (!pts) return;
  gs.prevScores[uid] = gs.scores[uid];
  gs.scores[uid] = Math.min(121, gs.scores[uid] + pts);
}

function checkGameOver(gs){
  for (const uid of gs.playerIds){
    if (gs.scores[uid] >= 121){
      if (gs.phase !== 'game_done'){
        gs.phase = 'game_done';
        gs.winner = uid;
        gs.endedAt = Date.now();
        // Session series tally (carried across rematches)
        gs.series = gs.series || {};
        gs.series[uid] = (gs.series[uid] || 0) + 1;
        const loser = gs.playerIds.find(p => p !== uid);
        appendLog(gs, uid, `wins ${gs.scores[uid]}–${gs.scores[loser]} 🏆`);
        // Fire stats once
        recordGameEnd(gs).catch(console.error);
      }
      return true;
    }
  }
  return false;
}

function updateBest(gs, uid, kind, value){
  if (!value) return;
  gs.bests[uid] = gs.bests[uid] || {};
  if (value > (gs.bests[uid][kind] || 0)){
    gs.bests[uid][kind] = value;
  }
}

/* ========================================================================
   9. Stats persistence (only writes once per game, by the winner's client)
   ======================================================================== */
async function recordGameEnd(gs){
  // Only the winner's browser writes, to avoid duplicate records.
  if (gs.winner !== userId) return;
  if (gs._statsWritten) return;
  gs._statsWritten = true;

  const winner = gs.winner;
  const loser = gs.playerIds.find(p => p !== winner);
  const loserScore = gs.scores[loser];
  const skunk = loserScore < 91;          // loser failed to pass skunk line (90)
  const doubleSkunk = loserScore < 61;    // loser failed to pass double-skunk

  // Game history record
  const histId = crypto.randomUUID();
  const histDoc = {
    _kind: KIND_HISTORY,
    id: histId,
    endedAt: gs.endedAt || Date.now(),
    startedAt: gs.createdAt,
    durationMs: (gs.endedAt || Date.now()) - gs.createdAt,
    handsPlayed: gs.handNumber,
    firstDealer: nameOf(gs.firstDealerUid || gs.player1.uid),
    players: gs.playerIds.map(uid => ({
      uid, name: nameOf(uid), score: gs.scores[uid],
      bestHand: (gs.bests[uid] && gs.bests[uid].hand) || 0,
      bestCrib: (gs.bests[uid] && gs.bests[uid].crib) || 0,
      bestPegRun: (gs.bests[uid] && gs.bests[uid].pegRun) || 0
    })),
    winner: { uid: winner, name: nameOf(winner) },
    loser:  { uid: loser,  name: nameOf(loser)  },
    skunk, doubleSkunk
  };
  try {
    await setDoc(historyRef(histId), histDoc);
  } catch(e){ console.error('history write failed', e); }

  // Aggregate stats for each player
  for (const uid of gs.playerIds){
    const ref = playerRef(uid);
    const snap = await getDoc(ref);
    const cur = snap.exists() ? snap.data() : {
      _kind: KIND_PLAYER,
      uid, name: nameOf(uid),
      wins: 0, losses: 0, streak: 0,
      bestHand: 0, bestHandWhen: null,
      bestCrib: 0, bestCribWhen: null,
      bestPegRun: 0, bestPegRunWhen: null,
      skunksFor: 0, skunksAgainst: 0,
      doubleSkunksFor: 0, doubleSkunksAgainst: 0
    };
    cur.name = nameOf(uid);
    if (uid === winner){
      cur.wins++;
      cur.streak = cur.streak >= 0 ? cur.streak+1 : 1;
      if (skunk) cur.skunksFor++;
      if (doubleSkunk) cur.doubleSkunksFor++;
    } else {
      cur.losses++;
      cur.streak = cur.streak <= 0 ? cur.streak-1 : -1;
      if (skunk) cur.skunksAgainst++;
      if (doubleSkunk) cur.doubleSkunksAgainst++;
    }
    const myBest = gs.bests[uid] || {};
    if ((myBest.hand||0) > cur.bestHand){ cur.bestHand = myBest.hand; cur.bestHandWhen = histDoc.endedAt; cur.bestHandOpp = nameOf(opponentInGame(gs, uid)); }
    if ((myBest.crib||0) > cur.bestCrib){ cur.bestCrib = myBest.crib; cur.bestCribWhen = histDoc.endedAt; cur.bestCribOpp = nameOf(opponentInGame(gs, uid)); }
    if ((myBest.pegRun||0) > cur.bestPegRun){ cur.bestPegRun = myBest.pegRun; cur.bestPegRunWhen = histDoc.endedAt; cur.bestPegRunOpp = nameOf(opponentInGame(gs, uid)); }
    try { await setDoc(ref, cur); } catch(e){ console.error('player stats write failed', e); }
  }
}

/* ========================================================================
   10. Rendering — board, hands, status, action bar
   ======================================================================== */
const $ = (id) => document.getElementById(id);

function render(){
  if (!G) return;
  let phaseChanged = false;
  if (G.phase !== lastRenderedPhase){
    localSelection = [];
    phaseChanged = lastRenderedPhase !== null;
    lastRenderedPhase = G.phase;
  }
  // Drop any local selections no longer present in our hand (new deal, etc.).
  const myHand = (G.hands && G.hands[userId]) || [];
  localSelection = localSelection.filter(c => myHand.includes(c));
  maybeShowPegPopup();
  renderStatus();
  renderScoreBar();
  renderBoard();
  renderHands();
  renderCrib();
  renderStarter();
  renderFanZone();
  renderPegging();
  renderActions();
  renderGameLog();
  renderBreakdownModal();
  renderGameOverModal();
  // Hide the invite panel once the opponent has joined.
  if (G.player2) $('invite-panel').classList.add('hidden');
  // Card-play sound: fires when the pegging history grows (either player).
  const hl = (G.peggingHistory || []).length;
  if (lastPegHistoryLen >= 0 && hl > lastPegHistoryLen) sndCard();
  lastPegHistoryLen = hl;
  // Gentle rise on phase transitions.
  if (phaseChanged){
    for (const id of ['middle-grid', 'fan-zone']){
      const zone = $(id);
      if (!zone.classList.contains('hidden')){
        zone.classList.remove('phase-enter');
        void zone.offsetWidth;
        zone.classList.add('phase-enter');
      }
    }
  }
}

function renderGameLog(){
  const panel = $('game-log-panel');
  const el = $('game-log');
  const log = G.log || [];
  if (!log.length){ panel.classList.add('hidden'); return; }
  panel.classList.remove('hidden');
  el.innerHTML = log.map(row => {
    const who = row.uid ? `<span class="log-who">${escapeHTML(row.uid === userId ? 'You' : nameOf(row.uid))}</span>` : '';
    const pts = row.pts ? ` <span class="log-pts">+${row.pts}</span>` : '';
    return `<div class="log-row">${who}<span>${escapeHTML(row.text)}${pts}</span></div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
}

function renderStatus(){
  const el = $('status-bar');
  if (!G.player2){
    el.textContent = `Waiting for opponent… Share the invite link.`;
    return;
  }
  const dealerName = nameOf(G.dealer);
  switch (G.phase){
    case 'cut_for_deal': {
      const cut = (G.cutForDeal || {})[userId];
      if (!cut) el.textContent = `Pick a card to decide who deals — lowest card deals first.`;
      else el.textContent = `You picked ${labelOf(cut)}${SUIT_GLYPH[suitOf(cut)]}. Waiting for ${nameOf(opponentOf(userId))} to pick…`;
      if (G.cutForDealTies) el.textContent += `  (Tied ${G.cutForDealTies}×, pick again)`;
      break;
    }
    case 'cut_for_deal_done': {
      const cd = G.cutForDeal || {};
      const me = cd[userId], opp = cd[opponentOf(userId)];
      const dealerName = nameOf(G.dealer);
      if (me && opp){
        el.textContent = `${nameOf(userId)} cut ${labelOf(me)}${SUIT_GLYPH[suitOf(me)]}, ${nameOf(opponentOf(userId))} cut ${labelOf(opp)}${SUIT_GLYPH[suitOf(opp)]}. ${dealerName} deals first.`;
      } else {
        el.textContent = `${dealerName} deals first.`;
      }
      break;
    }
    case 'discard': {
      const myHand = G.hands[userId] || [];
      const need = myHand.length - 4;
      if (need > 0) el.textContent = `Discard ${need} card${need===1?'':'s'} to the crib (${dealerName}'s crib). Select cards then confirm.`;
      else el.textContent = `Waiting for ${nameOf(opponentOf(userId))} to discard…`;
      break;
    }
    case 'cut':
      if (userId === G.pone) el.textContent = `Cut the deck to reveal the starter card.`;
      else el.textContent = `${nameOf(G.pone)} is cutting the deck…`;
      break;
    case 'pegging':
      if (G.peggingTurn === userId) el.textContent = `Your play. Running total: ${G.peggingTotal}.`;
      else el.textContent = `${nameOf(G.peggingTurn)} to play. Running total: ${G.peggingTotal}.`;
      break;
    case 'count':
      el.textContent = `Hand complete — review the scores and click Continue.`;
      break;
    case 'hand_done':
      el.textContent = `Hand complete. Next dealer: ${nameOf(opponentInGame(G, G.dealer))}.`;
      break;
    case 'game_done':
      el.textContent = `Game over!`;
      break;
    default:
      el.textContent = '';
  }
}

function renderScoreBar(){
  const el = $('score-bar');
  el.innerHTML = '';
  const pegColors = ['#d4af37', '#c0c0c0'];   // matches .peg-front-1 / .peg-front-2
  G.playerIds.forEach((uid, ix) => {
    const isMine = uid === userId;
    const isDealer = uid === G.dealer;
    const presence = isMine ? '' :
      `<span class="presence-dot ${isOnline(uid) ? 'online' : ''}" title="${isOnline(uid) ? 'Online' : 'Away'}"></span>`;
    const div = document.createElement('div');
    div.className = `score-row ${isMine ? 'bg-white/10' : ''}`;
    div.innerHTML = `
      <span class="score-dot" style="background:${pegColors[ix] || '#888'}"></span>
      <span class="font-semibold text-sm truncate">${escapeHTML(nameOf(uid))}${isMine?' <span class="text-[10px] text-emerald-300">(you)</span>':''}${presence}</span>
      ${isDealer ? '<span class="text-[10px] uppercase tracking-wide bg-amber-200/90 text-amber-900 rounded px-1 py-0.5 flex-none">Dealer</span>' : ''}
      <span class="ml-auto text-lg font-bold tabular-nums" style="font-family:var(--serif)">${G.scores[uid] || 0}</span>`;
    el.appendChild(div);
  });

  // Session series (populated once someone has won a game this session)
  const sl = $('series-line');
  const s = G.series || {};
  const [u1, u2] = G.playerIds;
  const total = (s[u1] || 0) + (s[u2] || 0);
  if (u2 && total > 0){
    sl.classList.remove('hidden');
    sl.textContent = `Series: ${nameOf(u1)} ${s[u1] || 0} – ${s[u2] || 0} ${nameOf(u2)}`;
  } else {
    sl.classList.add('hidden');
  }
}

/* ---- Cribbage board ---- */
// Classic three-straight, two-curve racetrack. Both players' hole rows run
// immediately adjacent within each straight so relative position is obvious.
// Desktop (≥900px): vertical board beside the felt. Narrow: horizontal above it.
function boardOrientation(){
  // Follow the layout the CSS actually produced (media queries and JS matchMedia
  // can disagree under zoomed/emulated viewports): a narrow side column gets the
  // vertical board, a full-width stacked aside gets the horizontal one.
  const aside = $('board-aside'), app = $('app');
  if (aside && app && aside.clientWidth > 0 && aside.clientWidth < app.clientWidth * 0.6){
    return 'vertical';
  }
  return 'horizontal';
}
// Board skeleton is built once per (orientation, player-names) and kept in the DOM;
// only the four peg elements move afterward, so CSS transitions actually animate them.
let boardGeom = null;   // { key, orient, p1, p2, holeR, freshBuild }

function renderBoard(){
  if (!G || !G.playerIds.length) return;
  const orient = boardOrientation();
  const key = `${orient}|${G.playerIds.map(uid => nameOf(uid)).join('|')}|${G.playerIds.length}`;
  if (!boardGeom || boardGeom.key !== key){
    buildBoardSkeleton(orient, key);
  }
  positionPegs();
}

function buildBoardSkeleton(orient, key){
  const svg = $('board-svg');
  const holesPerRow = 40;             // 40 × 3 + 1 game hole = 121
  const holeR = 4.2;
  const lane = 10;                    // ± offset between the two players' rows

  // Geometry abstraction: "m" = coordinate along a straight, "c" = cross-axis
  // centerline of that straight. Horizontal: (m,c) = (x,y). Vertical: (m,c) = (y,x),
  // with m running bottom → top so pegs climb the board.
  let W, H, rowCs, mStart, mEnd;
  if (orient === 'vertical'){
    W = 232; H = 660;
    rowCs = [48, 116, 184];
    mStart = 606; mEnd = 64;
  } else {
    W = 740; H = 280;
    rowCs = [55, 140, 225];
    mStart = 100; mEnd = 660;
  }
  const toXY = (orient === 'vertical')
    ? (m, c) => ({ x: c, y: m })
    : (m, c) => ({ x: m, y: c });
  const dm = (mEnd - mStart) / (holesPerRow - 1);
  const capOff = Math.sign(mEnd - mStart) * 26;
  const startCapM = mStart - capOff;
  const endCapM   = mEnd + capOff;

  function holeM(i){                  // main-axis coordinate of track index i (1..120)
    const r = Math.floor((i-1) / holesPerRow);
    const k = (i-1) % holesPerRow;
    return (r % 2 === 0) ? mStart + k*dm : mEnd - k*dm;
  }
  function holeRow(i){ return Math.floor((i-1) / holesPerRow); }

  // Hole-position arrays (length 122: index 0 = start, 1..121 = scoring).
  function trackPositions(laneOff){
    const pos = [];
    pos.push(toXY(startCapM, rowCs[0] + laneOff));            // 0: start hole
    for (let i = 1; i <= 120; i++){
      pos.push(toXY(holeM(i), rowCs[holeRow(i)] + laneOff));
    }
    pos.push(toXY(endCapM, rowCs[2] + laneOff));              // 121: game hole
    return pos;
  }
  const p1 = trackPositions(-lane);
  const p2 = trackPositions(+lane);

  let html = '';

  // --- Background plank: base fill + turbulence wood grain (clipped to plank) ---
  html += `<rect x="4" y="4" width="${W-8}" height="${H-8}" rx="14"
              fill="#7a4a22" stroke="#3e2613" stroke-width="3"/>`;
  html += `<g clip-path="url(#plank-clip)">
             <rect x="4" y="4" width="${W-8}" height="${H-8}" filter="url(#wood-grain-f)" opacity="0.5"/>
           </g>`;
  // Brass inlay border with corner screws
  html += `<rect x="13" y="13" width="${W-26}" height="${H-26}" rx="10"
              fill="none" stroke="url(#brass-lin)" stroke-width="1.8" opacity="0.85"/>`;
  for (const [sx, sy] of [[20,20],[W-20,20],[20,H-20],[W-20,H-20]]){
    html += `<circle cx="${sx}" cy="${sy}" r="2.6" fill="url(#peg-gold)" stroke="#6d5510" stroke-width="0.5"/>
             <line x1="${sx-1.5}" y1="${sy-1.5}" x2="${sx+1.5}" y2="${sy+1.5}" stroke="#6d5510" stroke-width="0.6"/>`;
  }

  // --- Routed lane grooves: one continuous track per player, curves included ---
  const dirFar = Math.sign(mEnd - mStart);
  function lanePathD(off){
    const pt = (m, c) => { const q = toXY(m, c); return `${q.x},${q.y}`; };
    const rowGap = rowCs[1] - rowCs[0];
    const bulgeFar  = mEnd + dirFar * (rowGap / 2 + 4);
    const bulgeNear = mStart - dirFar * (rowGap / 2 + 4);
    return `M ${pt(mStart, rowCs[0]+off)} L ${pt(mEnd, rowCs[0]+off)}` +
      ` C ${pt(bulgeFar, rowCs[0]+off)} ${pt(bulgeFar, rowCs[1]+off)} ${pt(mEnd, rowCs[1]+off)}` +
      ` L ${pt(mStart, rowCs[1]+off)}` +
      ` C ${pt(bulgeNear, rowCs[1]+off)} ${pt(bulgeNear, rowCs[2]+off)} ${pt(mStart, rowCs[2]+off)}` +
      ` L ${pt(mEnd, rowCs[2]+off)}`;
  }
  for (const [off, tint] of [[-lane, '#d4af37'], [+lane, '#c0c0c0']]){
    const d = lanePathD(off);
    html += `<path d="${d}" fill="none" stroke="#241407" stroke-width="11" opacity="0.45" stroke-linecap="round"/>`;
    html += `<path d="${d}" fill="none" stroke="${tint}" stroke-width="7.5" opacity="0.13" stroke-linecap="round"/>`;
  }

  // --- Skunk markers on holes 60 (faint dashed) and 90 (bold dashed) ---
  for (const [n, width] of [[60, 1.0], [90, 1.8]]){
    const m = holeM(n), c = rowCs[holeRow(n)];
    const a = toXY(m, c - lane - 8), b = toXY(m, c + lane + 8);
    html += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"
              stroke="#c0392b" stroke-width="${width}" stroke-dasharray="3 2"/>`;
  }

  // --- Group divider notches every 5 holes ---
  for (let r = 0; r < 3; r++){
    for (let g = 5; g < holesPerRow; g += 5){
      const m = (r % 2 === 0) ? mStart + (g - 0.5)*dm : mEnd - (g - 0.5)*dm;
      const a = toXY(m, rowCs[r] - lane - 4), b = toXY(m, rowCs[r] + lane + 4);
      html += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"
                stroke="#4a2e18" stroke-width="0.6" opacity="0.6"/>`;
    }
  }

  // --- Engraved numerals every 15 holes (dark cut + light catch-light) ---
  for (let n = 15; n <= 120; n += 15){
    const m = holeM(n), row = holeRow(n);
    const p = toXY(m, rowCs[row] + lane + 16);
    html += `<g font-family="'Libre Baskerville', Georgia, serif" font-style="italic"
                font-size="8" text-anchor="middle">
      <text x="${p.x + 0.5}" y="${p.y + 0.5}" fill="#a9793f" opacity="0.55">${n}</text>
      <text x="${p.x}" y="${p.y}" fill="#2a1708">${n}</text>
    </g>`;
  }

  // --- Start (S) / game-hole (121) labels + player names (horizontal only) ---
  const u1 = G.playerIds[0], u2 = G.playerIds[1];
  if (orient === 'vertical'){
    html += `<text x="${rowCs[0] - lane - 14}" y="${startCapM + 4}" text-anchor="middle"
              font-size="11" fill="#fde68a" font-weight="700">S</text>`;
    html += `<text x="${rowCs[2] + lane + 18}" y="${endCapM + 4}" text-anchor="middle"
              font-size="11" fill="#fde68a" font-weight="700">121</text>`;
  } else {
    html += `<text x="${startCapM}" y="${rowCs[0] - lane - 14}" text-anchor="middle"
              font-size="11" fill="#fde68a" font-weight="700">S</text>`;
    html += `<text x="${endCapM}" y="${rowCs[2] + lane + 22}" text-anchor="middle"
              font-size="11" fill="#fde68a" font-weight="700">121</text>`;
    html += `<text x="34" y="${rowCs[0] - lane + 3}" font-size="11"
                fill="#fde68a" font-weight="700">${escapeXML(nameOf(u1))}</text>`;
    if (u2) html += `<text x="34" y="${rowCs[0] + lane + 4}" font-size="11"
                fill="#fde68a" font-weight="700">${escapeXML(nameOf(u2))}</text>`;
  }

  // --- Engraved brass nameplate ---
  {
    const clip10 = s => (s || '').slice(0, 10);
    const plateText = (u1 && u2)
      ? `${clip10(nameOf(u1))} & ${clip10(nameOf(u2))}`
      : 'CRIBBAGE';
    const pw = 124, ph = 15;
    const px = W/2 - pw/2;
    const py = H - (orient === 'vertical' ? 22 : 24) - ph/2;
    html += `<g>
      <rect x="${px}" y="${py}" width="${pw}" height="${ph}" rx="3.5"
        fill="url(#brass-lin)" stroke="#6d5510" stroke-width="0.7"/>
      <rect x="${px+1.6}" y="${py+1.6}" width="${pw-3.2}" height="${ph-3.2}" rx="2.2"
        fill="none" stroke="#6d5510" stroke-width="0.4" opacity="0.6"/>
      <text x="${W/2}" y="${py + ph/2 + 2.8}" text-anchor="middle"
        font-family="'Libre Baskerville', Georgia, serif" font-style="italic"
        font-size="8" fill="#4a3206">${escapeXML(plateText)}</text>
    </g>`;
  }

  // --- Holes: drilled look via radial gradient + faint top rim ---
  function drawHoles(positions){
    let s = '';
    for (let i = 0; i <= 121; i++){
      const p = positions[i];
      s += `<circle cx="${p.x}" cy="${p.y}" r="${holeR}"
              fill="url(#hole-g)" stroke="#8b5a2b" stroke-width="0.35" stroke-opacity="0.5"/>`;
    }
    return s;
  }
  html += drawHoles(p1);
  html += drawHoles(p2);

  // --- Persistent pegs: turned-brass groups moved via CSS transform ---
  // Back peg drawn first so the front peg overlaps when they share a hole (start).
  function pegMarkup(id, fillId, hidden){
    return `<g id="${id}" class="peg peg-move" ${hidden ? 'visibility="hidden"' : ''}>
      <circle class="peg-body" r="${holeR+1.7}" fill="url(#${fillId})" stroke="#3a2208" stroke-width="0.5"/>
      <circle r="1.3" cx="-1.6" cy="-1.8" fill="rgba(255,255,255,0.7)"/>
    </g>`;
  }
  html += pegMarkup('peg-1-back',  'peg-gold-dk', false);
  html += pegMarkup('peg-1-front', 'peg-gold', false);
  html += pegMarkup('peg-2-back',  'peg-silver-dk', true);
  html += pegMarkup('peg-2-front', 'peg-silver', true);

  // --- Defs: wood turbulence, plank clip, brass + peg + hole gradients ---
  const grainFreq = (orient === 'vertical') ? '0.14 0.012' : '0.012 0.14';
  const defs = `<defs>
    <clipPath id="plank-clip">
      <rect x="4" y="4" width="${W-8}" height="${H-8}" rx="14"/>
    </clipPath>
    <filter id="wood-grain-f" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="${grainFreq}" numOctaves="4" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.32 0.55 0.40"/>
        <feFuncG type="table" tableValues="0.19 0.35 0.25"/>
        <feFuncB type="table" tableValues="0.08 0.17 0.11"/>
        <feFuncA type="table" tableValues="1 1"/>
      </feComponentTransfer>
    </filter>
    <linearGradient id="brass-lin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eed48a"/>
      <stop offset="0.5" stop-color="#c9a227"/>
      <stop offset="1" stop-color="#9d7c17"/>
    </linearGradient>
    <radialGradient id="hole-g" cx="0.38" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#2b1a0a"/>
      <stop offset="0.65" stop-color="#170d04"/>
      <stop offset="1" stop-color="#050301"/>
    </radialGradient>
    <radialGradient id="peg-gold" cx="0.34" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#f8e9b0"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#8a6d14"/>
    </radialGradient>
    <radialGradient id="peg-gold-dk" cx="0.34" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#d9bd66"/>
      <stop offset="0.5" stop-color="#a8871c"/>
      <stop offset="1" stop-color="#6d5510"/>
    </radialGradient>
    <radialGradient id="peg-silver" cx="0.34" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c4c4c4"/>
      <stop offset="1" stop-color="#767676"/>
    </radialGradient>
    <radialGradient id="peg-silver-dk" cx="0.34" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#d8d8d8"/>
      <stop offset="0.5" stop-color="#9a9a9a"/>
      <stop offset="1" stop-color="#5d5d5d"/>
    </radialGradient>
  </defs>`;

  svg.innerHTML = defs + html;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  boardGeom = { key, orient, p1, p2, holeR, freshBuild: true };
}

function positionPegs(){
  if (!boardGeom || !G) return;
  const instant = boardGeom.freshBuild;
  boardGeom.freshBuild = false;
  const [u1, u2] = G.playerIds;
  setPeg('peg-1-front', boardGeom.p1[clamp(G.scores[u1]||0, 0, 121)], instant);
  setPeg('peg-1-back',  boardGeom.p1[clamp(G.prevScores[u1]||0, 0, 121)], instant);
  const p2f = $('peg-2-front'), p2b = $('peg-2-back');
  if (u2){
    p2f.removeAttribute('visibility');
    p2b.removeAttribute('visibility');
    setPeg('peg-2-front', boardGeom.p2[clamp(G.scores[u2]||0, 0, 121)], instant);
    setPeg('peg-2-back',  boardGeom.p2[clamp(G.prevScores[u2]||0, 0, 121)], instant);
  } else {
    p2f.setAttribute('visibility', 'hidden');
    p2b.setAttribute('visibility', 'hidden');
  }
}

function setPeg(id, pos, instant){
  const el = $(id);
  if (!el || !pos) return;
  if (instant) el.classList.add('no-anim');
  el.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
  if (instant){
    void el.getBoundingClientRect();   // flush so the transition doesn't fire
    el.classList.remove('no-anim');
  } else {
    // Brief brass glint when a peg actually moves.
    const key = `${pos.x},${pos.y}`;
    if (lastPegPositions[id] && lastPegPositions[id] !== key){
      el.classList.remove('peg-pulse');
      void el.getBoundingClientRect();
      el.classList.add('peg-pulse');
    }
  }
  lastPegPositions[id] = `${pos.x},${pos.y}`;
}

function clamp(n,a,b){ return Math.max(a, Math.min(b, n)); }

/* ---- Hands ---- */
function renderHands(){
  const meEl = $('player-hand');
  const oppEl = $('opponent-hand');
  meEl.innerHTML = '';
  oppEl.innerHTML = '';

  const oppId = opponentOf(userId);

  // Labels
  $('player-label').textContent = `You — ${nameOf(userId)}${G.dealer===userId?' (Dealer)':''}`;
  $('opponent-label').textContent = `Opponent — ${oppId?nameOf(oppId):'(waiting)'}${oppId && G.dealer===oppId ? ' (Dealer)' : ''}`;

  // Active-turn glow: whose action is the game waiting on?
  let glowMe = false, glowOpp = false;
  if (G.phase === 'pegging'){
    glowMe = G.peggingTurn === userId;
    glowOpp = oppId && G.peggingTurn === oppId;
  } else if (G.phase === 'discard' && G.hands){
    glowMe = (G.hands[userId] || []).length > 4;
    glowOpp = oppId && (G.hands[oppId] || []).length > 4;
  } else if (G.phase === 'cut'){
    glowMe = G.pone === userId;
    glowOpp = oppId && G.pone === oppId;
  } else if (G.phase === 'cut_for_deal'){
    glowMe = !(G.cutForDeal && G.cutForDeal[userId]);
    glowOpp = oppId && !(G.cutForDeal && G.cutForDeal[oppId]);
  }
  $('my-zone').classList.toggle('zone-active', !!glowMe);
  $('opp-zone').classList.toggle('zone-active', !!glowOpp);

  if (!G.hands || !G.hands[userId]){
    meEl.style.height = '0px';
    oppEl.style.height = '0px';
    return;
  }

  const myHand = G.hands[userId];
  const inPegging = G.phase === 'pegging';
  const myTurn = G.peggingTurn === userId;
  const discarding = G.phase === 'discard' && myHand.length > 4;

  layFan(meEl, myHand.length, 'hand', false, (i, slot, tilt) => {
    const c = myHand[i];
    const selected = localSelection.includes(c);
    const tooBig = inPegging && (valueOf(c) + effectivePegTotal(G) > 31);
    const playable = inPegging && myTurn && !tooBig;
    if (selected) slot.classList.add('card-selected');
    if (inPegging && (!myTurn || tooBig)) slot.classList.add('card-disabled');
    if (discarding || playable) slot.classList.add('liftable');
    tilt.innerHTML = renderCardSVG(c, cardDims('hand'));
    slot.addEventListener('click', ()=>{
      if (G.phase === 'discard'){
        toggleSelection(c);
      } else if (inPegging && playable){
        actPlayCard(c);
      }
    });
  });

  // Opponent: face-down fan of equal count
  const oppHand = oppId ? (G.hands[oppId] || []) : [];
  layFan(oppEl, oppHand.length, 'opp', true, (i, slot, tilt) => {
    const d = cardDims('opp');
    tilt.innerHTML = renderBackSVG(d.w, d.h);
  });

  // Deal-in: staggered fly-in once per fresh deal (not when joining mid-hand).
  const dealKey = `${gameId}|${G.handNumber}|${myHand.length ? 'dealt' : 'none'}`;
  const prevDeal = animWindows.deal;
  const dealFresh = !!prevDeal && prevDeal.key !== dealKey && myHand.length > 0;
  const DEAL_DUR = 500 + 6 * 70;
  const dealElapsed = animElapsed('deal', dealKey, dealFresh, DEAL_DUR);
  if (dealElapsed >= 0){
    [...meEl.children, ...oppEl.children].forEach((slot, i) => {
      slot.classList.add('deal-in');
      slot.style.animationDelay = `${(i % 6) * 70 - dealElapsed}ms`;
    });
  }
}

/* Lay n cards as an arc fan inside `container` (a .hand-fan element).
   fill(i, slotEl, tiltEl) decorates each card. */
function layFan(container, n, kind, isOpp, fill){
  const dims = cardDims(kind);
  container.style.height = n ? `${dims.h + (isOpp ? 22 : 30)}px` : '0px';
  if (!n) return;
  const cw = container.clientWidth || 400;
  const maxStep = dims.w * 0.62;
  const step = n > 1 ? Math.min(maxStep, (cw - dims.w) / (n - 1)) : 0;
  const total = dims.w + step * (n - 1);
  const x0 = Math.max(0, (cw - total) / 2);
  const mid = (n - 1) / 2;
  for (let i = 0; i < n; i++){
    const slot = document.createElement('div');
    slot.className = 'fan-slot';
    slot.style.left = `${x0 + i * step}px`;
    slot.style.zIndex = 10 + i;
    const tilt = document.createElement('div');
    tilt.className = 'tilt';
    const ang = (i - mid) * (isOpp ? -3.6 : 4.4);
    const sag = Math.pow(Math.abs(i - mid), 1.7) * 3.4;
    tilt.style.transform = `rotate(${ang}deg) translateY(${sag}px)`;
    slot.appendChild(tilt);
    fill(i, slot, tilt);
    container.appendChild(slot);
  }
}

function isNarrow(){ return window.matchMedia('(max-width: 640px)').matches; }
function cardDims(kind){
  const n = isNarrow();
  switch (kind){
    case 'hand':  return n ? {w:56, h:80} : {w:78, h:110};
    case 'opp':   return n ? {w:42, h:60} : {w:56, h:80};
    case 'pile':  return n ? {w:46, h:66} : {w:56, h:80};
    case 'stack': return n ? {w:40, h:57} : {w:50, h:71};
    default:      return {w:60, h:86};
  }
}

function toggleSelection(c){
  const ix = localSelection.indexOf(c);
  if (ix >= 0) localSelection.splice(ix, 1);
  else if (localSelection.length < 2) localSelection.push(c);
  else { localSelection.shift(); localSelection.push(c); }
  render();
}

/* ---- Crib / starter / pegging stack ---- */
function renderCrib(){
  const slotOpp = $('crib-slot-opp'), slotMe = $('crib-slot-me');
  slotOpp.innerHTML = '';
  slotMe.innerHTML = '';
  const n = (G.crib || []).length;
  if (!G.dealer || !n) return;
  const slot = (G.dealer === userId) ? slotMe : slotOpp;
  const dims = cardDims('stack');
  const wrap = document.createElement('div');
  wrap.className = 'flex flex-col items-center gap-1';
  const stack = document.createElement('div');
  stack.className = 'stack';
  stack.style.width = `${dims.w + 10}px`;
  stack.style.height = `${dims.h + 10}px`;
  for (let i = 0; i < n; i++){
    const d = document.createElement('div');
    d.className = 'card';
    d.style.left = `${3 + i * 1.5}px`;
    d.style.top = `${8 - i * 2}px`;
    d.style.transform = `rotate(${(i % 2 ? -1 : 1) * (1 + i)}deg)`;
    d.innerHTML = renderBackSVG(dims.w, dims.h);
    stack.appendChild(d);
  }
  wrap.appendChild(stack);
  const cap = document.createElement('div');
  cap.className = 'caption text-center';
  cap.textContent = `crib`;
  wrap.appendChild(cap);
  slot.appendChild(wrap);
}


function renderStarter(){
  const el = $('starter-area');
  el.innerHTML = '';
  const dims = cardDims('stack');
  const wrap = document.createElement('div');
  wrap.className = 'stack';
  wrap.style.width = `${dims.w + 12}px`;
  wrap.style.height = `${dims.h + 8}px`;
  // The undealt deck: a few squared backs
  for (let i = 0; i < 3; i++){
    const d = document.createElement('div');
    d.className = 'card';
    d.style.left = `${i * 1.5}px`;
    d.style.top = `${(2 - i) * 1.5}px`;
    d.innerHTML = renderBackSVG(dims.w, dims.h);
    wrap.appendChild(d);
  }
  if (G.starter){
    const sc = document.createElement('div');
    sc.className = 'card persp';
    sc.style.left = '6px';
    sc.style.top = '0px';
    sc.style.transform = 'rotate(-4deg)';
    const inner = document.createElement('div');
    inner.innerHTML = renderCardSVG(G.starter, dims);
    sc.appendChild(inner);
    wrap.appendChild(sc);
    // Flip reveal when the starter transitions from absent to present.
    const starterKey = `${gameId}|${G.handNumber}|${G.starter}`;
    const prevStarter = animWindows.starter;
    const fresh = !!prevStarter && prevStarter.key === `${gameId}|${G.handNumber}|none`;
    const flipElapsed = animElapsed('starter', starterKey, fresh, 450);
    if (flipElapsed >= 0){
      inner.style.animationDelay = `${-flipElapsed}ms`;
      inner.classList.add('flip-in');
    }
  } else {
    // Record the "no starter yet" state so the flip gate can see the transition.
    animElapsed('starter', `${gameId}|${G.handNumber}|none`, false, 0);
  }
  el.appendChild(wrap);
}

/* ---- Fan zone: spread-out deck for cut-for-deal and the starter cut ---- */
function renderFanZone(){
  const zone = $('fan-zone');
  const grid = $('middle-grid');
  const fanPhases = ['cut_for_deal', 'cut_for_deal_done', 'cut'];
  if (!G.player2 || !fanPhases.includes(G.phase)){
    zone.classList.add('hidden');
    grid.classList.remove('hidden');
    return;
  }
  zone.classList.remove('hidden');
  grid.classList.add('hidden');

  const picksEl = $('fan-picks');
  const fanEl = $('fan-container');
  const captionEl = $('fan-caption');
  picksEl.innerHTML = '';

  if (G.phase === 'cut_for_deal' || G.phase === 'cut_for_deal_done'){
    // Picked cards face-up above the fan
    for (const uid of G.playerIds){
      const c = (G.cutForDeal || {})[uid];
      const col = document.createElement('div');
      col.className = 'flex flex-col items-center gap-1';
      col.innerHTML = `<div class="text-xs text-emerald-100/80 font-semibold">${escapeHTML(nameOf(uid))}</div>
        <div class="card">${c ? renderCardSVG(c, {w:48,h:68}) : renderBackSVG(48,68)}</div>`;
      picksEl.appendChild(col);
    }
    if (G.phase === 'cut_for_deal'){
      const iPicked = !!(G.cutForDeal && G.cutForDeal[userId]);
      const deckLen = (G.cutDeck || []).length || 52;
      const pickedIdx = new Set(Object.values(G.cutForDealPicks || {}));
      buildFan(fanEl, deckLen, pickedIdx, !iPicked, (ix) => actPickCutForDeal(ix));
      captionEl.textContent = iPicked
        ? `Waiting for ${nameOf(opponentOf(userId))} to pick…`
        : 'Pick a card — lowest card deals first.' + (G.cutForDealTies ? ` (Tied ${G.cutForDealTies}×, pick again)` : '');
    } else {
      fanEl.innerHTML = '';
      fanEl.style.height = '0px';
      captionEl.textContent = `${nameOf(G.dealer)} deals first.`;
    }
  } else if (G.phase === 'cut'){
    const deckLen = (G._cutDeck || []).length || 40;
    const myCut = userId === G.pone;
    buildFan(fanEl, deckLen, new Set(), myCut, (ix) => actCutDeck(ix));
    captionEl.textContent = myCut
      ? 'Cut the deck — pick a card to reveal the starter.'
      : `${nameOf(G.pone)} is cutting the deck…`;
  }
}

function buildFan(container, count, pickedIdxSet, interactive, onPick){
  container.classList.toggle('fan-active', interactive);
  container.classList.toggle('fan-disabled', !interactive);
  const cardW = 64, cardH = 92;
  // The fan zone was just unhidden by the caller, so clientWidth is current.
  const cw = container.clientWidth || 600;
  // Narrow screens get two rows — twice the spread per card, friendlier taps.
  const rows = cw < 560 ? 2 : 1;
  const perRow = Math.ceil(count / rows);
  const rowH = cardH + 16;
  container.style.height = `${rows * rowH + 4}px`;
  container.innerHTML = '';
  const span = Math.max(0, cw - cardW - 8);
  for (let i = 0; i < count; i++){
    if (pickedIdxSet.has(i)) continue;         // gap where a card was taken
    const row = Math.floor(i / perRow);
    const rowCount = Math.min(perRow, count - row*perRow);
    const step = rowCount > 1 ? span / (rowCount - 1) : 0;
    const d = document.createElement('div');
    d.className = 'fan-card';
    d.style.left = `${4 + (i % perRow)*step}px`;
    d.style.top = `${4 + row*rowH}px`;
    d.style.zIndex = i;
    d.innerHTML = renderBackSVG(cardW, cardH);
    if (interactive) d.addEventListener('click', () => onPick(i));
    container.appendChild(d);
  }
}

function renderPegging(){
  const el = $('pegging-area');
  el.innerHTML = '';
  el.classList.toggle('peg-round-done', !!G.peggingRoundCompleted);
  const inPegging = (G.phase === 'pegging');

  // Big running-count chip
  const chip = $('peg-count-chip');
  if (inPegging){
    chip.classList.remove('hidden');
    chip.textContent = G.peggingTotal;
    chip.classList.toggle('chip-done', !!G.peggingRoundCompleted);
    chip.title = G.peggingRoundCompleted ? 'Round complete — next card starts at 0' : 'Running count';
  } else {
    chip.classList.add('hidden');
  }

  // Keep showing the most recent round even after phase moved (so the last card stays visible).
  // Opponent's cards ride high, yours ride low; each lands with its own small tilt.
  const round = G.peggingRound || [];
  $('pegging-caption').style.visibility = (inPegging || round.length) ? 'visible' : 'hidden';
  // Record the pile state even when empty, so the first play reads as a transition.
  const thrownKey = `${gameId}|${G.handNumber}|${(G.peggingHistory || []).length}`;
  const prevThrown = animWindows.thrown;
  const isNewPlay = !!prevThrown && prevThrown.key !== thrownKey &&
    prevThrown.key.startsWith(`${gameId}|${G.handNumber}|`);
  const thrownElapsed = animElapsed('thrown', thrownKey, isNewPlay, 380);
  if (round.length === 0) return;
  round.forEach((p, ix) => {
    const mine = p.uid === userId;
    // Outer cell carries the cascade slot + throw animation; inner holds the
    // resting tilt so the two transforms never fight.
    const c = document.createElement('div');
    c.className = 'card peg-card';
    c.style.zIndex = 10 + ix;
    c.title = `${nameOf(p.uid)} played ${labelOf(p.card)}${SUIT_GLYPH[suitOf(p.card)]}`;
    const inner = document.createElement('div');
    inner.style.transform = `translateY(${mine ? 9 : -9}px) rotate(${cardJitter(p.card)}deg)`;
    inner.innerHTML = renderCardSVG(p.card, cardDims('pile'));
    c.appendChild(inner);
    el.appendChild(c);
  });

  // Thrown-card animation for the newest play only.
  if (thrownElapsed >= 0 && el.lastChild){
    const mine = round[round.length - 1].uid === userId;
    el.lastChild.style.setProperty('--fromY', mine ? '70px' : '-70px');
    el.lastChild.style.animationDelay = `${-thrownElapsed}ms`;
    el.lastChild.classList.add('thrown');
  }
}

// Deterministic small tilt per card, so the cascade looks hand-thrown but stable.
function cardJitter(card){
  let h = 0;
  for (const ch of card) h = (h * 31 + ch.charCodeAt(0)) & 0xffff;
  return (h % 9) - 4;
}

/* Pegging scoring popup ("Fifteen for 2", etc.) — shows briefly on each new event. */

  if (!G || !G.lastPegEvent) return;

  if (G.phase === 'discard'){

    if (myHand.length > 4){

      btn.className = 'btn btn-brass px-4 py-2';
      const need = myHand.length - 4;

        if (localSelection.length !== need){
          alert(`Select exactly ${need} card${need===1?'':'s'} (you have ${localSelection.length}).`);
          return;
        }
        const sel = [...localSelection];
        localSelection = [];
        pendingAction = 'discard';
        render();   // immediately reflect pending state
        try {
          await actDiscardToCrib(sel);
        } catch(e){
          console.error('Discard threw:', e);
          alert(`Discard threw: ${e.message || e}`);
        } finally {
          pendingAction = null;
          render();
        }
      });
      el.appendChild(btn);
    }
  } else if (G.phase === 'pegging' && G.peggingTurn === userId){
    const myHand = G.hands[userId] || [];

// Rematch: create the next game prefilled with both players, then point the old
// doc at it — both clients' listeners hop over together.
async function actRematch(){
  if (!G || G.phase !== 'game_done' || G.nextGameId) return;
  if (!G.player2) { alert('Opponent left — start a new game from the menu.'); return; }
  const newId = crypto.randomUUID();
  const gs = newGameState(G.player1.uid, G.player1.name);
  gs.player2 = { uid: G.player2.uid, name: G.player2.name };
  gs.playerIds = [...G.playerIds];
  gs.scores = {}; gs.prevScores = {};
  for (const uid of gs.playerIds){ gs.scores[uid] = 0; gs.prevScores[uid] = 0; }
  gs.phase = 'cut_for_deal';
  gs.cutDeck = shuffleInPlace(makeDeck());
  gs.cutForDeal = {};
  gs.cutForDealPicks = {};
  gs.cutForDealTies = 0;
  gs.series = clone(G.series || {});
  const [su1, su2] = gs.playerIds;
  appendLog(gs, null, `Rematch — series ${nameOf(su1)} ${gs.series[su1]||0} – ${gs.series[su2]||0} ${nameOf(su2)}`);
  try {
    await setDoc(gameRef(newId), gs);
    await updateDoc(gameRef(gameId), { nextGameId: newId });
  } catch(e){
    console.error('Rematch failed', e);
    alert(`Rematch failed: ${e.code || e.message}`);
  }
}

async function loadAndShowStats(){
  $('main-menu').classList.add('hidden');
  $('game-screen').classList.add('hidden');
  $('stats-screen').classList.remove('hidden');
  const el = $('stats-content');
  el.innerHTML = '<p class="text-stone-500">Loading…</p>';

  try {
    const gamesCol = collection(db, GAMES_PATH);
    const psnap = await getDocs(query(gamesCol, where('_kind','==',KIND_PLAYER)));
    const players = [];
    psnap.forEach(d => players.push(d.data()));

    const hsnap = await getDocs(query(gamesCol, where('_kind','==',KIND_HISTORY), orderBy('endedAt','desc'), limit(50)));
    const history = [];
    hsnap.forEach(d => history.push(d.data()));

    // Render
    let html = '';

    // Head-to-head banner (the two most active players)
    const byGames = [...players].sort((a,b)=>((b.wins||0)+(b.losses||0))-((a.wins||0)+(a.losses||0)));
    if (byGames.length >= 2){
      const [a, b] = byGames;
      html += `<div class="bg-white rounded-2xl shadow-md p-4 text-center text-stone-800">
        <div class="text-xs uppercase tracking-wide text-stone-400 mb-1">Head to head</div>
        <div class="text-2xl font-bold">
          ${escapeHTML(a.name||'?')} <span class="text-emerald-600">${a.wins||0}</span>
          <span class="text-stone-400 font-normal mx-1">–</span>
          <span class="text-emerald-600">${b.wins||0}</span> ${escapeHTML(b.name||'?')}
        </div>
      </div>`;
    }

    const bestLine = (label, val, when, opp) => {
      if (!val) return `<div>${label}: <span class="font-semibold">0</span></div>`;
      const meta = [];
      if (opp) meta.push(`vs ${escapeHTML(opp)}`);
      if (when) meta.push(new Date(when).toLocaleDateString());
      return `<div>${label}: <span class="font-semibold">${val}</span>
        ${meta.length ? `<span class="text-stone-400">(${meta.join(', ')})</span>` : ''}</div>`;
    };

    // Per-player aggregates
    html += `<div class="bg-white rounded-2xl shadow-md p-5 text-stone-800">
      <h3 class="font-bold text-lg mb-3">Players</h3>`;
    if (!players.length){
      html += `<p class="text-stone-500">No games played yet.</p>`;
    } else {
      html += `<div class="grid sm:grid-cols-2 gap-4">`;
      for (const p of players.sort((a,b)=> (b.wins||0)-(a.wins||0))){
        const streakLabel = (p.streak||0) === 0 ? '–'
          : (p.streak > 0 ? `W${p.streak}` : `L${-p.streak}`);
        html += `
          <div class="border border-stone-200 rounded-xl p-3">
            <div class="flex justify-between items-baseline">
              <div class="font-semibold">${escapeHTML(p.name || p.uid)}</div>
              <div class="text-sm text-stone-500">${p.wins||0}–${p.losses||0} (${streakLabel})</div>
            </div>
            <div class="text-xs text-stone-600 mt-2 space-y-1">
              ${bestLine('Best hand', p.bestHand, p.bestHandWhen, p.bestHandOpp)}
              ${bestLine('Best crib', p.bestCrib, p.bestCribWhen, p.bestCribOpp)}
              ${bestLine('Best pegging run', p.bestPegRun, p.bestPegRunWhen, p.bestPegRunOpp)}
              <div>Skunks for/against: ${p.skunksFor||0}/${p.skunksAgainst||0}</div>
              <div>Double skunks for/against: ${p.doubleSkunksFor||0}/${p.doubleSkunksAgainst||0}</div>
            </div>
          </div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;

    // History
    html += `<div class="bg-white rounded-2xl shadow-md p-5 mt-4 text-stone-800">
      <h3 class="font-bold text-lg mb-3">Recent Games</h3>`;
    if (!history.length){
      html += `<p class="text-stone-500">No games yet.</p>`;
    } else {
      html += `<div class="scrollbox">
        <table class="w-full text-sm">
          <thead class="text-left text-stone-500 border-b">
            <tr><th class="py-1 pr-2">Date</th><th class="py-1 pr-2">Winner</th><th class="py-1 pr-2">Score</th><th class="py-1 pr-2">Duration</th><th class="py-1">Hands</th></tr>
          </thead>
          <tbody>`;
      for (const g of history){
        const d = new Date(g.endedAt);
        const mins = Math.round((g.durationMs||0)/60000);
        const skunkTag = g.doubleSkunk ? ' <span class="text-xs text-red-600">2×skunk</span>'
                        : g.skunk ? ' <span class="text-xs text-orange-600">skunk</span>' : '';
        const wScore = g.players.find(p=>p.uid===g.winner.uid)?.score ?? '';
        const lScore = g.players.find(p=>p.uid===g.loser.uid)?.score ?? '';
        html += `<tr class="border-b last:border-0">
          <td class="py-1 pr-2 whitespace-nowrap">${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</td>
          <td class="py-1 pr-2">${escapeHTML(g.winner.name)}${skunkTag}</td>
          <td class="py-1 pr-2 tabular-nums">${wScore}–${lScore}</td>
          <td class="py-1 pr-2">${mins}m</td>
          <td class="py-1">${g.handsPlayed||'?'}</td>
        </tr>`;
      }
      html += `</tbody></table></div>`;
    }
    html += `</div>`;

    el.innerHTML = html;
  } catch(e){
    el.innerHTML = `<p class="text-red-600">Error loading stats: ${escapeHTML(e.message)}</p>`;
  }
}

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function escapeHTML(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeXML(s){ return escapeHTML(s); }

async function tryCopy(text){
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) { /* fall through */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

async function copyLink(){
  if (!gameId){ alert('No active game yet.'); return; }
  const url = `${location.origin}${location.pathname}?gameId=${gameId}`;
  const panel = $('invite-panel');
  const input = $('invite-url');
  const status = $('invite-status');
  input.value = url;
  panel.classList.remove('hidden');
  // Auto-select for easy manual copy
  setTimeout(()=> { input.focus(); input.select(); }, 0);
  const ok = await tryCopy(url);
  status.textContent = ok ? 'Copied!' : 'Select & copy manually';
  status.className = ok ? 'text-xs text-emerald-700' : 'text-xs text-stone-600';
}

function updateURL(){
  if (gameId){
    const url = `${location.pathname}?gameId=${gameId}`;
    history.replaceState(null, '', url);
  }
}

  });
  // Browsers unlock audio only after a user gesture — prime the context on first click.
  document.addEventListener('click', ()=> ac(), { once: true });

  // Re-render on any viewport/layout size change: board flips orientation at
  // 900px, fans and the card fan re-space. ResizeObserver catches embedded-pane
  // resizes that never dispatch window `resize`.
  let resizeTimer = null;
  const scheduleRender = () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (G) render(); }, 120);
  };
  window.addEventListener('resize', scheduleRender);
  new ResizeObserver(scheduleRender).observe(document.body);
  $('invite-copy-again').addEventListener('click', async ()=>{
    const url = $('invite-url').value;
    const ok = await tryCopy(url);
    $('invite-status').textContent = ok ? 'Copied!' : 'Select & copy manually';
    $('invite-status').className = ok ? 'text-xs text-emerald-700' : 'text-xs text-stone-600';
  });

  // Initialize Firebase
  try {
    app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    auth = getAuth(app);
    await signInAnonymously(auth);
    userId = auth.currentUser.uid;
    isAuthReady = true;
  } catch(e){
    console.error('Auth failed', e);
    alert('Failed to connect. Check your network.');
    return;
  }

  // If URL has gameId, attempt to join
  const params = new URLSearchParams(location.search);
  const urlGameId = params.get('gameId');
  if (urlGameId){
    // We need a name first. If they have one stored, use it. Otherwise prompt via menu.
    const stored = localStorage.getItem(LOCAL_NAME_KEY);
    if (!stored){
      showMenu();
      // After they type a name and click "New Game", we'd lose context. Repurpose UI:
      // Replace "New Game" with "Join Game" temporarily.
      // NOTE: the create-game handler above was attached with addEventListener, so we must
      // physically drop it — otherwise a single click fires BOTH handlers (create a new
      // orphan game AND join), and the joiner races into the wrong game, hanging both
      // players on "Waiting for opponent…". Cloning the node discards its event listeners.
      const oldBtn = $('new-game-btn');
      const btn = oldBtn.cloneNode(true);
      oldBtn.replaceWith(btn);
      btn.textContent = 'Join Game';
      btn.addEventListener('click', async ()=>{
        const name = ($('name-input').value || '').trim();
        if (!name){ alert('Please enter your name.'); return; }
        localStorage.setItem(LOCAL_NAME_KEY, name);
        await joinExistingGame(urlGameId);
      });
      return;
    }
    await joinExistingGame(urlGameId);
  } else {
    showMenu();
  }
});

</script>
